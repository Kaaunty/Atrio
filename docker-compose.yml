name: atrio
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: atrio-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${API_PORT:-3333}:3333"
    restart: unless-stopped
    volumes:
      - api_uploads:/app/uploads
    environment:
      PORT: ${API_PORT:-3333}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:?DEFAULT_USER_PASSWORD must be set}
      TIMEZONE: America/Sao_Paulo
      UPLOADS_DIR: /app/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - coolify

  web:
    image: atrio-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - default
      - coolify

volumes:
  redis_data:
  api_uploads:

networks:
  default:
  coolify:
    external: true

